# Étude synthétique : contamination des sorties d'entraînement uniquement.
seed: 42
n_seeds: 3
n_train: 1400
n_val: 300
n_test: 500
noise_std: 0.15
contamination_rates: [0.0, 0.05, 0.10, 0.20, 0.30, 0.40]
outlier_magnitude: 6.0
# Quatre couches suffisent pour cette régression en dimension 1.
hidden_dim: 64
hidden_layers: 4
learning_rate: 0.001
weight_decay: 0.0001
batch_size: 128
epochs: 180
min_epochs: 70
patience: 45
min_delta: 0.00001
grad_clip: 5.0
huber_delta: 1.0
tukey_c: 4.685
warmup_epochs: 20
models: [mse, huber, huber_warmup, tukey, tukey_warmup]
device: auto
output_dir: outputs
